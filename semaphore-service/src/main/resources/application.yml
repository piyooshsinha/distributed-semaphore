spring:
  application:
    name: semaphore-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/distsem
    username: distsem
    password: distsem  # local development only; deployments set SPRING_DATASOURCE_PASSWORD
    hikari:
      pool-name: distsem
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8183
  shutdown: graceful

distsem:
  store:
    waiter-lease: 10s
    max-ttl: 1h
    max-wait-timeout: 10m
    lock-timeout: 5s
  long-poll:
    max-hold: 25s
    fallback-poll: 1s
  housekeeping:
    reap-interval: 1s
    event-retention: 7d
    prune-interval: 1h
  fleet:
    offline-after: 5s
    forget-after: 1h
    command-ttl: 5m
  security:
    api-key: ""

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    status:
      order: down, out-of-service, degraded, unknown, up
      http-mapping:
        degraded: 200
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        distsem.acquire.duration: true
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.distsem: INFO
